[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpt-physics-lab"
version = "0.3.0"
description = "DPT Physics & Reality Lab"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
